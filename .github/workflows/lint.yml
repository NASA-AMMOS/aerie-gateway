name: Lint

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        # general policy: pin `uses` dependencies to commit hashes to avoid tag-poisoning attacks
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # throw away GH token after this step so future steps can't use it
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install Dev Dependencies and Build
        run: |
          npm ci --ignore-scripts
          npm rebuild --strict-allow-scripts

      - name: Lint
        run: |
          npm run lint

      - name: Check formatting
        run: |
          npm run format:check
